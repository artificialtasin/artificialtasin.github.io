<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Knowledge Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; }
        
        /* Header */
        header { background: #1e1e1e; padding: 15px; text-align: center; border-bottom: 1px solid #333; }
        header h1 { font-size: 1.2rem; color: #4da6ff; }
        
        /* Chat Container */
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 0.95rem; }
        .user-message { background: #007acc; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot-message { background: #252526; color: #d4d4d4; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #3c3c3c; }
        
        /* Input Area */
        .input-area { background: #1e1e1e; padding: 15px; display: flex; gap: 10px; border-top: 1px solid #333; }
        input { flex: 1; padding: 12px 16px; background: #2d2d2d; border: 1px solid #3c3c3c; border-radius: 25px; color: white; outline: none; font-size: 1rem; }
        input:focus { border-color: #007acc; }
        button { background: #007acc; color: white; border: none; padding: 0 20px; border-radius: 25px; cursor: pointer; font-weight: bold; }
        button:hover { background: #005999; }
    </style>
</head>
<body>

    <header>
        <h1>🤖 IT Knowledge AI Assistant</h1>
    </header>

    <div class="chat-container" id="chatBox">
        <div class="message bot-message">
            হ্যালো! আমি আপনার ৫০টি আইটি কোম্পানির ডাটাবেজ সহ সহকারী। যেকোনো কোম্পানি বা বিষয় সম্পর্কে জানতে প্রশ্ন করুন (যেমন: Amazon, NVIDIA বা ভারত)।
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="এখানে মেসেজ লিখুন..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        let companyData = [];

        // Load and parse markdown data on startup
        window.onload = async function() {
            try {
                const fileName = encodeURIComponent('তথ্য প্রযুক্তি (IT), ডেটা প্রসেসিং, ক্লাউড কম্পিউটিং, সেমিকন্ডাক্টর….md');
                const res = await fetch(fileName);
                const text = await res.text();
                parseMarkdownTable(text);
            } catch (err) {
                console.error("Data load failed:", err);
            }
        };

        function parseMarkdownTable(text) {
            const lines = text.split('\n');
            lines.forEach(line => {
                if (line.includes('|') && !line.includes('---') && !line.includes('কোম্পানির নাম')) {
                    const cols = line.split('|').map(c => c.trim()).filter(c => c !== '');
                    if (cols.length >= 3) {
                        companyData.push({
                            rank: cols[0],
                            name: cols[1],
                            country: cols[2],
                            details: cols[3] || 'তথ্য পাওয়া যায়নি'
                        });
                    }
                }
            });
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const query = input.value.trim();
            if (!query) return;

            // Add User Message
            appendMessage(query, 'user-message');
            input.value = '';

            // Generate Bot Answer
            setTimeout(() => {
                const response = getAIResponse(query);
                appendMessage(response, 'bot-message');
            }, 300);
        }

        function appendMessage(text, className) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerHTML = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function getAIResponse(query) {
            if (companyData.length === 0) {
                return "দুঃখিত, আপনার তথ্য ফাইলটি পাওয়া যাচ্ছে না। ফাইলের নাম সঠিক আছে কিনা নিশ্চিত করুন।";
            }

            const q = query.toLowerCase();
            const matches = companyData.filter(item => 
                item.name.toLowerCase().includes(q) || 
                item.country.toLowerCase().includes(q) || 
                item.details.toLowerCase().includes(q)
            );

            if (matches.length === 0) {
                return `দুঃখিত, "${query}" সম্পর্কিত কোনো তথ্য আমার কাছে নেই। আপনি কোনো আইটি কোম্পানি বা দেশের নাম দিয়ে চেষ্টা করতে পারেন।`;
            }

            let reply = `আপনার প্রশ্নের ভিত্তিতে তথ্য নিচে দেওয়া হলো:<br><br>`;
            matches.forEach(item => {
                reply += `<b>📌 ${item.name}</b> (র‍্যাংক: ${item.rank})<br>`;
                reply += `• <b>দেশ:</b> ${item.country}<br>`;
                reply += `• <b>প্রধান ক্ষেত্র:</b> ${item.details}<br><br>`;
            });

            return reply;
        }
    </script>
</body>
</html>
