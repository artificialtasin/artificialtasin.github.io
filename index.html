<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Knowledge Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #121212; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #1e1e1e; padding: 15px; text-align: center; border-bottom: 1px solid #2d2d2d; }
        header h1 { font-size: 1.2rem; color: #4da6ff; }
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.4; word-wrap: break-word; }
        .user-message { background: #007acc; color: white; align-self: flex-end; }
        .bot-message { background: #252526; color: #e0e0e0; align-self: flex-start; border: 1px solid #333; }
        .input-area { background: #1e1e1e; padding: 15px; display: flex; gap: 10px; border-top: 1px solid #2d2d2d; }
        .input-area input { flex: 1; padding: 12px 16px; background: #2d2d2d; border: 1px solid #3d3d3d; border-radius: 8px; color: white; outline: none; }
        .input-area input:focus { border-color: #007acc; }
        .input-area button { background: #007acc; color: white; border: none; padding: 0 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .input-area button:hover { background: #005999; }
    </style>
</head>
<body>

    <header>
        <h1>🤖 AI Assistant</h1>
    </header>

    <div class="chat-container" id="chatBox">
        <div class="message bot-message">Hello! I am your AI assistant. Ask me anything about the top IT companies, technologies, or countries.</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');

        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // యూസർ মেসেজ যুক্ত করা
            appendMessage(text, 'user-message');
            userInput.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // লোডিং মেসেজ তৈরি করা
            const loadingId = appendMessage('Thinking...', 'bot-message');

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                
                
                document.getElementById(loadingId).remove();
                
                if (data.reply) {
                    appendMessage(data.reply, 'bot-message');
                } else {
                    appendMessage('Sorry, I received an empty response.', 'bot-message');
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage('Error: Could not connect to the server.', 'bot-message');
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendMessage(text, className) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${className}`;
            messageDiv.textContent = text;
            const id = 'msg-' + Date.now();
            messageDiv.id = id;
            chatBox.appendChild(messageDiv);
            return id;
        }
    </script>
</body>
</html>
